name: backend-ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.15.0, cache: pnpm }
      - uses: pnpm/action-setup@v4
        with: { version: 11.15.1 }
      - run: pnpm install --frozen-lockfile
      - run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: pnpm openapi:check
      - run: pnpm test:ci
        env: { MONGOMS_DOWNLOAD_DIR: /tmp/sanfaani-completion-mongo }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-evidence, path: test-results/**, if-no-files-found: ignore }
